<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muxammad &amp; Zarnigorxon — To'y taklifnomasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Tangerine:wght@700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#071D18;
    --bg-mid:#0B2B24;
    --sage:#123028;
    --gold:#C6A15B;
    --gold-light:#E8D9B0;
    --ivory:#F3ECDD;
    --ivory-dim:#c9c0ab;
    --pomegranate:#9C3B3B;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html{
    scroll-behavior:smooth;
  }
  html.snap-ready{
    scroll-snap-type:y mandatory;
  }
  @media (prefers-reduced-motion: reduce){
    html.snap-ready{ scroll-snap-type:none; }
  }

  body{
    background:var(--bg-deep);
    color:var(--ivory);
    font-family:'Jost',sans-serif;
    overflow-x:hidden;
    position:relative;
  }
  body.intro-locked{
    height:100svh;
    overflow:hidden;
  }

  /* ---------- Intro / envelope opener ---------- */
  #intro-overlay{
    position:fixed;
    inset:0;
    z-index:300;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(198,161,91,0.08), transparent 60%),
      var(--bg-deep);
    transition:opacity .8s ease, visibility .8s ease;
  }
  #intro-overlay.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .intro-stars{
    position:absolute;
    inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 15% 20%, rgba(198,161,91,0.6), transparent),
      radial-gradient(1.5px 1.5px at 82% 15%, rgba(198,161,91,0.5), transparent),
      radial-gradient(1px 1px at 35% 75%, rgba(198,161,91,0.5), transparent),
      radial-gradient(1.5px 1.5px at 68% 82%, rgba(198,161,91,0.5), transparent),
      radial-gradient(1px 1px at 90% 60%, rgba(198,161,91,0.45), transparent),
      radial-gradient(1px 1px at 8% 55%, rgba(198,161,91,0.4), transparent);
  }
  .intro-content{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px;
    width:100%;
    max-width:380px;
    text-align:center;
    animation:intro-in 1.1s ease both;
  }
  @keyframes intro-in{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .intro-eyebrow{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:15px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:34px;
  }

  .envelope{
    position:relative;
    width:min(240px, 62vw);
    aspect-ratio:1.45;
    margin-bottom:38px;
    perspective:800px;
  }
  .envelope-shadow{
    position:absolute;
    left:6%;right:6%;bottom:-14px;
    height:20px;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0.45), transparent 70%);
  }
  .envelope-body{
    position:absolute;
    inset:0;
    background:linear-gradient(160deg, var(--sage), var(--bg-mid));
    border:1px solid rgba(198,161,91,0.5);
    border-radius:4px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom:14%;
  }
  .envelope-names{
    font-family:'Tangerine',cursive;
    font-size:34px;
    color:var(--gold-light);
    opacity:0.85;
  }
  .envelope-flap{
    position:absolute;
    top:0;left:0;right:0;
    height:58%;
    background:linear-gradient(160deg, #163e33, var(--sage));
    border:1px solid rgba(198,161,91,0.5);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    transform-origin:top center;
    transition:transform 1s cubic-bezier(.62,0,.3,1), opacity .6s ease .2s;
  }
  .envelope-seal{
    position:absolute;
    top:44%;left:50%;
    width:52px;height:52px;
    transform:translate(-50%,-50%);
    background:var(--gold);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:17px;
    color:var(--bg-deep);
    box-shadow:0 6px 16px rgba(0,0,0,0.4);
    transition:transform .5s ease, opacity .5s ease;
  }
  .envelope.open .envelope-flap{
    transform:rotateX(-165deg);
    opacity:0;
  }
  .envelope.open .envelope-seal{
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
  }
  @media (prefers-reduced-motion: reduce){
    .envelope-flap, .envelope-seal{ transition:opacity .4s ease; }
    .envelope.open .envelope-flap{ transform:none; }
    .envelope.open .envelope-seal{ transform:translate(-50%,-50%); }
  }

  .intro-hint{
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--ivory-dim);
    margin-bottom:16px;
  }

  .slide-track{
    position:relative;
    width:100%;
    max-width:270px;
    height:54px;
    border:1px solid rgba(198,161,91,0.4);
    border-radius:999px;
    background:rgba(243,236,221,0.04);
    display:flex;
    align-items:center;
    padding:5px;
    overflow:hidden;
  }
  .slide-fill{
    position:absolute;
    left:0;top:0;bottom:0;
    width:52px;
    background:linear-gradient(90deg, transparent, rgba(198,161,91,0.22));
    pointer-events:none;
  }
  .slide-handle{
    position:relative;
    z-index:2;
    width:44px;height:44px;
    border-radius:50%;
    background:var(--gold);
    color:var(--bg-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:grab;
    touch-action:none;
    box-shadow:0 3px 12px rgba(0,0,0,0.35);
  }
  .slide-handle:active{ cursor:grabbing; }
  .slide-handle svg{ width:20px;height:20px; }

  @media (max-width:400px){
    .envelope{ margin-bottom:30px; }
    .intro-eyebrow{ margin-bottom:26px; }
  }

  .snap-page{
    scroll-snap-align:start;
    scroll-snap-stop:always;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  #particle-canvas{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    z-index:0;
    pointer-events:none;
  }

  .content{
    position:relative;
    z-index:1;
  }

  /* ---------- Language switcher ---------- */
  .lang-switch{
    position:fixed;
    top:20px;right:20px;
    z-index:50;
    display:flex;
    gap:2px;
    background:rgba(7,29,24,0.6);
    backdrop-filter:blur(6px);
    border:1px solid rgba(198,161,91,0.35);
    border-radius:999px;
    padding:4px;
  }
  .lang-switch button{
    background:none;
    border:none;
    color:var(--ivory-dim);
    font-family:'Jost',sans-serif;
    font-size:12px;
    letter-spacing:0.08em;
    padding:7px 13px;
    border-radius:999px;
    cursor:pointer;
    transition:all .3s ease;
  }
  .lang-switch button.active{
    background:var(--gold);
    color:var(--bg-deep);
    font-weight:600;
  }

  @media (max-width:640px){
    .lang-switch{ top:14px; right:14px; }
    .lang-switch button{ font-size:11px; padding:6px 10px; }
  }
  @media (max-width:340px){
    .lang-switch button{ padding:5px 8px; }
  }

  /* ---------- Music toggle ---------- */
  .music-toggle{
    position:fixed;
    bottom:20px;right:20px;
    z-index:50;
    width:44px;height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(7,29,24,0.6);
    backdrop-filter:blur(6px);
    border:1px solid rgba(198,161,91,0.35);
    border-radius:50%;
    color:var(--ivory-dim);
    cursor:pointer;
    transition:color .3s ease, border-color .3s ease;
  }
  .music-toggle svg{ width:19px;height:19px; }
  .music-toggle.playing{ color:var(--gold-light); border-color:var(--gold); }

  .music-wave{
    display:none;
    align-items:flex-end;
    justify-content:center;
    gap:3px;
    width:19px;
    height:17px;
  }
  .music-toggle.playing .music-wave{ display:flex; }
  .music-toggle.playing svg{ display:none; }
  .music-wave span{
    width:3px;
    min-height:3px;
    border-radius:2px;
    background:currentColor;
    animation:wave-bounce 0.9s ease-in-out infinite;
  }
  .music-wave span:nth-child(1){ animation-delay:-0.6s; }
  .music-wave span:nth-child(2){ animation-delay:-0.3s; }
  .music-wave span:nth-child(3){ animation-delay:-0.75s; }
  .music-wave span:nth-child(4){ animation-delay:-0.15s; }
  @keyframes wave-bounce{
    0%,100%{ height:4px; }
    50%{ height:17px; }
  }
  @media (prefers-reduced-motion: reduce){
    .music-wave span{ animation:none; height:10px; }
  }
  @media (max-width:640px){
    .music-toggle{ bottom:14px; right:14px; width:40px;height:40px; }
    .music-toggle svg{ width:17px;height:17px; }
    .music-wave{ width:17px;height:15px; }
  }

  /* ---------- Section base ---------- */
  section{
    position:relative;
    padding:120px 24px;
    max-width:920px;
    margin:0 auto;
    text-align:center;
  }

  @media (max-width:640px){
    section{ padding:80px 18px; }
  }
  @media (max-width:380px){
    section{ padding:64px 14px; }
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:28px;
  }

  /* ---------- Hero ---------- */
  #hero{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding-top:80px;
    padding-bottom:60px;
  }
  @media (max-width:640px){
    #hero{ padding-top:64px; padding-bottom:40px; }
  }

  .rosette{
    width:220px;height:220px;
    margin:6px auto 6px;
    animation:spin 90s linear infinite;
  }
  @media (max-width:480px){
    .rosette{ width:160px; height:160px; }
  }
  @media (max-width:340px){
    .rosette{ width:130px; height:130px; }
  }
  @media (prefers-reduced-motion: reduce){
    .rosette{animation:none;}
  }
  .rosette svg{width:100%;height:100%;}

  @keyframes spin{ to{ transform:rotate(360deg); } }

  .name{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-size:clamp(40px,8vw,74px);
    color:var(--ivory);
    line-height:1.05;
    letter-spacing:0.01em;
  }
  .name.italic{ font-style:italic; }

  .amp{
    font-family:'Tangerine',cursive;
    font-size:clamp(60px,12vw,110px);
    color:var(--gold);
    display:block;
    line-height:0.9;
    margin:-6px 0;
  }

  .subtitle{
    margin-top:26px;
    font-size:16px;
    color:var(--ivory-dim);
    letter-spacing:0.03em;
  }

  .date-line{
    margin-top:14px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:22px;
    color:var(--gold-light);
  }

  .scroll-cue{
    margin-top:70px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    font-size:11px;
    letter-spacing:0.2em;
    color:var(--ivory-dim);
    animation:bob 2.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .scroll-cue{animation:none;} }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(8px);} }
  .scroll-cue svg{ width:16px;height:16px; }

  /* ---------- Divider ---------- */
  .divider{
    width:1px;height:70px;
    background:linear-gradient(var(--gold),transparent);
    margin:0 auto;
  }

  /* ---------- Poem ---------- */
  #poem .verse{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(19px,3.4vw,28px);
    line-height:1.9;
    color:var(--gold-light);
    max-width:520px;
    margin:0 auto;
  }

  /* ---------- Countdown ---------- */
  h2.section-title{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(20px,6.2vw,42px);
    color:var(--ivory);
    margin-bottom:50px;
    white-space:nowrap;
  }

  .countdown{
    display:flex;
    justify-content:center;
    gap:clamp(10px,3vw,28px);
    flex-wrap:wrap;
  }
  .count-box{
    min-width:78px;
    border:1px solid rgba(198,161,91,0.3);
    background:rgba(198,161,91,0.05);
    border-radius:4px;
    padding:20px 10px 16px;
  }
  .count-num{
    font-family:'Cormorant Garamond',serif;
    font-size:40px;
    color:var(--gold-light);
    font-variant-numeric:tabular-nums;
  }
  .count-label{
    margin-top:6px;
    font-size:10px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ivory-dim);
  }

  /* ---------- Details ---------- */
  .details-grid{
    margin-top:10px;
    display:grid;
    gap:28px;
  }
  .detail-row{
    border-bottom:1px solid rgba(198,161,91,0.18);
    padding-bottom:24px;
  }
  .detail-label{
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:8px;
  }
  .detail-value{
    font-family:'Cormorant Garamond',serif;
    font-size:26px;
    color:var(--ivory);
  }
  .detail-sub{
    margin-top:4px;
    font-size:14px;
    color:var(--ivory-dim);
  }

  .map-embed{
    margin-top:36px;
    width:100%;
    height:320px;
    border:1px solid rgba(198,161,91,0.3);
    border-radius:6px;
    overflow:hidden;
  }
  .map-embed iframe{ display:block; filter:saturate(0.85) brightness(0.92); }

  .map-btn{
    margin-top:20px;
    display:inline-block;
    border:1px solid var(--gold);
    color:var(--gold-light);
    text-decoration:none;
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    padding:14px 34px;
    border-radius:999px;
    transition:all .3s ease;
  }
  .map-btn:hover{ background:var(--gold); color:var(--bg-deep); }

  /* ---------- Gift ---------- */
  .gift-card{
    position:relative;
    width:100%;
    max-width:360px;
    margin:0 auto;
    padding:30px 26px 26px;
    border:1px solid rgba(198,161,91,0.35);
    border-radius:12px;
    background:linear-gradient(160deg, rgba(198,161,91,0.08), rgba(243,236,221,0.02));
  }
  .gift-card-label{
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:12px;
  }
  .gift-card-number{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(22px,5.5vw,30px);
    letter-spacing:0.06em;
    color:var(--ivory);
    word-spacing:0.15em;
  }
  .gift-card-holder{
    margin-top:10px;
    font-size:12px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--ivory-dim);
  }
  .gift-copy-btn{
    margin-top:22px;
    width:100%;
    border:1px solid var(--gold);
    background:transparent;
    color:var(--gold-light);
    font-family:'Jost',sans-serif;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    padding:13px;
    border-radius:999px;
    cursor:pointer;
    transition:all .3s ease;
  }
  .gift-copy-btn:hover{ background:var(--gold); color:var(--bg-deep); }
  .gift-copy-btn.copied{ background:var(--gold); color:var(--bg-deep); border-color:var(--gold); }
  .gift-note{
    margin:28px auto 0;
    max-width:400px;
    font-size:14px;
    color:var(--ivory-dim);
  }
  #gift .map-btn{ margin-top:22px; }

  /* ---------- RSVP ---------- */
  #rsvp{ padding-bottom:100px; }
  .rsvp-form{
    margin-top:40px;
    display:flex;
    flex-direction:column;
    gap:22px;
    text-align:left;
  }
  .field label{
    display:block;
    font-size:11px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:8px;
  }
  .field input[type="text"],
  .field input[type="number"],
  .field textarea{
    width:100%;
    background:rgba(243,236,221,0.04);
    border:1px solid rgba(198,161,91,0.3);
    border-radius:3px;
    color:var(--ivory);
    font-family:'Jost',sans-serif;
    font-size:15px;
    padding:13px 14px;
    outline:none;
    transition:border-color .3s;
  }
  .field input:focus,
  .field textarea:focus{ border-color:var(--gold); }
  .field textarea{ resize:vertical; min-height:90px; }

  .attend-toggle{
    display:flex;
    gap:12px;
  }
  .attend-toggle button{
    flex:1;
    padding:13px;
    background:rgba(243,236,221,0.04);
    border:1px solid rgba(198,161,91,0.3);
    border-radius:3px;
    color:var(--ivory-dim);
    font-family:'Jost',sans-serif;
    font-size:14px;
    letter-spacing:0.04em;
    cursor:pointer;
    transition:all .25s;
  }
  .attend-toggle button.selected{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--bg-deep);
    font-weight:600;
  }

  .submit-btn{
    margin-top:10px;
    background:var(--pomegranate);
    color:var(--ivory);
    border:none;
    padding:16px;
    font-family:'Jost',sans-serif;
    font-size:14px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    border-radius:3px;
    cursor:pointer;
    transition:background .3s;
  }
  .submit-btn:hover{ background:#8a3232; }

  .thank-you{
    display:none;
    text-align:center;
    padding:30px 20px;
    border:1px solid rgba(198,161,91,0.35);
    border-radius:4px;
    margin-top:24px;
  }
  .thank-you.show{ display:block; }
  .thank-you .ty-title{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:26px;
    color:var(--gold-light);
    margin-bottom:10px;
  }
  .thank-you .ty-msg{ color:var(--ivory-dim); font-size:14px; }

  /* ---------- Footer ---------- */
  footer{
    text-align:center;
    padding:70px 24px 60px;
    position:relative;
    z-index:1;
  }
  footer .foot-msg{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:22px;
    color:var(--gold-light);
  }
  footer .foot-names{
    margin-top:10px;
    font-size:12px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--ivory-dim);
  }

  @media (min-width:640px){
    .details-grid{ grid-template-columns:1fr 1fr; }
    .detail-row:last-child{ grid-column:1 / -1; }
  }

  /* ---------- Scroll reveal animations ---------- */
  .reveal{
    opacity:0;
    transform:translateY(22px);
    transition:opacity .8s cubic-bezier(.16,.7,.24,1), transform .8s cubic-bezier(.16,.7,.24,1);
  }
  .reveal.reveal-left{ transform:translateX(-38px); }
  .reveal.reveal-right{ transform:translateX(38px); }
  .reveal.reveal-scale{ transform:scale(.92); }
  .reveal.in-view{ opacity:1; transform:none; }

  .stagger-group > *{
    opacity:0;
    transform:translateY(20px);
    transition:opacity .7s cubic-bezier(.16,.7,.24,1), transform .7s cubic-bezier(.16,.7,.24,1);
  }
  .stagger-group.in-view > *{ opacity:1; transform:none; }
  .stagger-group > *:nth-child(1){ transition-delay:.03s; }
  .stagger-group > *:nth-child(2){ transition-delay:.13s; }
  .stagger-group > *:nth-child(3){ transition-delay:.23s; }
  .stagger-group > *:nth-child(4){ transition-delay:.33s; }
  .stagger-group > *:nth-child(5){ transition-delay:.43s; }
  .stagger-group > *:nth-child(6){ transition-delay:.53s; }

  .type-line{
    display:inline-block;
    overflow:hidden;
    white-space:nowrap;
    vertical-align:bottom;
    width:0;
    border-right:2px solid transparent;
  }
  .type-line.typing{
    border-right-color:var(--gold);
    animation:caret-blink .85s step-end infinite;
  }
  .type-line.done{ border-right-color:transparent; }
  @keyframes caret-blink{ 50%{ border-right-color:transparent; } }

  @media (prefers-reduced-motion: reduce){

let currentLang = "uz";

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(translations[lang][key] !== undefined){
      el.textContent = translations[lang][key];
    }
  });
  document.querySelectorAll(".lang-switch button").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });
}

document.querySelectorAll(".lang-switch button").forEach(btn=>{
  btn.addEventListener("click", ()=> applyLang(btn.dataset.lang));
});

/* ======================= INTRO / ENVELOPE OPENER ======================= */
(function(){
  const overlay = document.getElementById("intro-overlay");
  const envelope = document.getElementById("envelope");
  const track = document.getElementById("slide-track");
  const handle = document.getElementById("slide-handle");
  const fill = document.getElementById("slide-fill");

  let dragging = false;
  let startX = 0;
  let currentX = 0;
  let maxX = 0;
  let opened = false;

  function getMaxX(){
    return Math.max(0, track.clientWidth - handle.offsetWidth - 10);
  }

  function setHandleX(x){
    currentX = Math.max(0, Math.min(x, maxX));
    handle.style.transform = `translateX(${currentX}px)`;
    fill.style.width = (currentX + handle.offsetWidth) + "px";
  }

  function onPointerDown(e){
    if(opened) return;
    dragging = true;
    maxX = getMaxX();
    startX = e.clientX - currentX;
    if(handle.setPointerCapture && e.pointerId != null){
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    }
  }

  function onPointerMove(e){
    if(!dragging || opened) return;
    setHandleX(e.clientX - startX);
  }

  function onPointerUp(){
    if(!dragging || opened) return;
    dragging = false;
    if(maxX > 0 && currentX >= maxX * 0.78){
      completeSlide();
    } else {
      handle.style.transition = "transform .35s ease";
      fill.style.transition = "width .35s ease";
      setHandleX(0);
      setTimeout(()=>{ handle.style.transition = ""; fill.style.transition = ""; }, 360);
    }
  }

  function autoSlideOpen(){
    if(opened) return;
    maxX = getMaxX();
    handle.style.transition = "transform .5s ease";
    fill.style.transition = "width .5s ease";
    setHandleX(maxX);
    setTimeout(completeSlide, 480);
  }

  function completeSlide(){
    if(opened) return;
    opened = true;
    envelope.classList.add("open");
    if(typeof startMusicOnce === "function"){ startMusicOnce(); }
    setTimeout(()=>{
      overlay.classList.add("hide");
      document.body.classList.remove("intro-locked");
      if(typeof initScrollReveals === "function"){ initScrollReveals(); }
    }, 600);
    setTimeout(()=>{ overlay.remove(); }, 1500);
  }

  handle.addEventListener("pointerdown", onPointerDown);
  window.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);

  handle.addEventListener("click", ()=>{
    if(!opened && currentX < 4){ autoSlideOpen(); }
  });
  track.addEventListener("click", (e)=>{
    if(e.target === track || e.target === fill){ autoSlideOpen(); }
  });
})();

/* ======================= SCROLL REVEAL ANIMATIONS ======================= */
const revealObserver = new IntersectionObserver((entries, obs)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add("in-view");
      obs.unobserve(entry.target);
    }
  });
}, { threshold:0.18, rootMargin:"0px 0px -8% 0px" });

function measureTextWidth(text, font){
  const canvas = measureTextWidth._canvas || (measureTextWidth._canvas = document.createElement("canvas"));
  const ctx = canvas.getContext("2d");
  ctx.font = font;
  return ctx.measureText(text).width;
}

function typePoemLines(){
  const lines = document.querySelectorAll("#poem .verse .type-line");
  let delay = 150;
  lines.forEach(span=>{
    const text = span.textContent;
    const font = getComputedStyle(span).font;
    const width = Math.ceil(measureTextWidth(text, font)) + 3;
    const charCount = Math.max(text.length, 1);
    const duration = Math.min(Math.max(charCount * 42, 450), 1500);
    setTimeout(()=>{
      span.classList.add("typing");
      span.style.transition = `width ${duration}ms steps(${charCount},end)`;
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{ span.style.width = width + "px"; });
      });
      setTimeout(()=>{
        span.classList.remove("typing");
        span.classList.add("done");
      }, duration + 200);
    }, delay);
    delay += duration + 320;
  });
}

function initPoemTypewriter(reduced){
  const lines = document.querySelectorAll("#poem .verse .type-line");
  if(lines.length === 0) return;
  if(reduced){
    lines.forEach(span=>{ span.style.width = "auto"; });
    return;
  }
  const poemEl = document.querySelector("#poem .verse");
  const poemObserver = new IntersectionObserver((entries, obs)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        typePoemLines();
        obs.unobserve(entry.target);
      }
    });
  }, { threshold:0.4 });
  poemObserver.observe(poemEl);
}

let revealsStarted = false;
function initScrollReveals(){
  if(revealsStarted) return;
  revealsStarted = true;

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const targets = document.querySelectorAll(".reveal, .stagger-group");
  if(reduced){
    targets.forEach(el=> el.classList.add("in-view"));
  } else {
    targets.forEach(el=> revealObserver.observe(el));
  }
  initPoemTypewriter(reduced);
}

(function(){
  const copyBtn = document.getElementById("gift-copy-btn");
  const cardNumberEl = document.getElementById("gift-card-number");
  if(!copyBtn || !cardNumberEl) return;

  copyBtn.addEventListener("click", ()=>{
    const digits = cardNumberEl.textContent.replace(/\s/g, "");
    const finish = ()=>{
      copyBtn.classList.add("copied");
      copyBtn.textContent = translations[currentLang].copiedBtn;
      setTimeout(()=>{
        copyBtn.classList.remove("copied");
        copyBtn.textContent = translations[currentLang].copyBtn;
      }, 1800);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(digits).then(finish).catch(finish);
    } else {
      const temp = document.createElement("textarea");
      temp.value = digits;
      temp.style.position = "fixed";
      temp.style.opacity = "0";
      document.body.appendChild(temp);
      temp.select();
      try{ document.execCommand("copy"); }catch(err){}
      document.body.removeChild(temp);
      finish();
    }
  });
})();

function updateCountdown(){
  const now = Date.now();
  let diff = targetDate - now;
  if(diff < 0) diff = 0;

  const days = Math.floor(diff / (1000*60*60*24));
  const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
  const mins = Math.floor((diff % (1000*60*60)) / (1000*60));
  const secs = Math.floor((diff % (1000*60)) / 1000);

  document.getElementById("cd-days").textContent = String(days).padStart(2,"0");
  document.getElementById("cd-hours").textContent = String(hours).padStart(2,"0");
  document.getElementById("cd-mins").textContent = String(mins).padStart(2,"0");
  document.getElementById("cd-secs").textContent = String(secs).padStart(2,"0");
}
updateCountdown();
setInterval(updateCountdown, 1000);

/* TODO: @BotFather orqali bot yaratib, tokenni shu yerga qo'ying.
   Chat ID ni olish uchun botga bir marta /start yozing (yoki uni kanalga admin
   qilib qo'shing), so'ng https://api.telegram.org/bot<TOKEN>/getUpdates
   sahifasini oching — javobda "chat":{"id":...} qiymatini topasiz. */
const TELEGRAM_BOT_TOKEN = "YOUR_BOT_TOKEN_HERE";
const TELEGRAM_CHAT_ID = "YOUR_CHAT_ID_HERE";

function sendRsvpToTelegram(data){
  if(TELEGRAM_BOT_TOKEN === "YOUR_BOT_TOKEN_HERE" || !TELEGRAM_BOT_TOKEN){
    return Promise.resolve();
  }
  const lines = [
    "Yangi RSVP javobi",
    "Ism: " + data.name,
    "Keladimi: " + (data.attending === "yes" ? "Ha" : "Yo'q"),
    "Mehmonlar soni: " + data.guests,
  ];
  if(data.message){ lines.push("Xabar: " + data.message); }
  const text = lines.join("\n");
  const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
  return fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: text })
  }).catch(err=>{ console.error("Telegramga yuborishda xatolik:", err); });
}

});

/* ======================= THREE.JS PARTICLE FIELD ======================= */
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = document.getElementById("particle-canvas");

if(!reduceMotion && window.THREE){
  const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.z = 14;

  const PARTICLE_COUNT = 220;
  const positions = new Float32Array(PARTICLE_COUNT * 3);
  const speeds = new Float32Array(PARTICLE_COUNT);
  const drift = new Float32Array(PARTICLE_COUNT);

  for(let i=0;i<PARTICLE_COUNT;i++){
    positions[i*3] = (Math.random()-0.5) * 26;
    positions[i*3+1] = (Math.random()-0.5) * 20;
    positions[i*3+2] = (Math.random()-0.5) * 14;
    speeds[i] = 0.004 + Math.random()*0.008;
    drift[i] = Math.random()*Math.PI*2;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

  // soft circular sprite drawn on a canvas texture
  const spriteCanvas = document.createElement("canvas");
  spriteCanvas.width = 64; spriteCanvas.height = 64;
  const ctx = spriteCanvas.getContext("2d");
  const grad = ctx.createRadialGradient(32,32,0,32,32,32);
  grad.addColorStop(0, "rgba(232,217,176,0.9)");
  grad.addColorStop(0.4, "rgba(198,161,91,0.5)");
  grad.addColorStop(1, "rgba(198,161,91,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,64,64);
  const spriteTexture = new THREE.CanvasTexture(spriteCanvas);

  const material = new THREE.PointsMaterial({
    size: 0.42,
    map: spriteTexture,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    opacity: 0.85
  });

  const points = new THREE.Points(geometry, material);
  scene.add(points);

  let mouseX = 0, mouseY = 0;
  window.addEventListener("mousemove", (e)=>{
    mouseX = (e.clientX / window.innerWidth - 0.5);
    mouseY = (e.clientY / window.innerHeight - 0.5);
  });

  function animate(){
    requestAnimationFrame(animate);
    const pos = geometry.attributes.position.array;
    for(let i=0;i<PARTICLE_COUNT;i++){
      pos[i*3+1] += speeds[i];
      pos[i*3] += Math.sin(Date.now()*0.0006 + drift[i]) * 0.0025;
      if(pos[i*3+1] > 11){
        pos[i*3+1] = -11;
      }
    }
    geometry.attributes.position.needsUpdate = true;

    camera.position.x += (mouseX*1.2 - camera.position.x) * 0.02;
    camera.position.y += (-mouseY*1.2 - camera.position.y) * 0.02;
    camera.lookAt(scene.position);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener("resize", ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
} else {
  canvas.style.display = "none";
}
</script>
