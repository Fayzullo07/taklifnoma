<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muxammad &amp; Zarnigorxon — To'y taklifnomasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Tangerine:wght@700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#071D18;
    --bg-mid:#0B2B24;
    --sage:#123028;
    --gold:#C6A15B;
    --gold-light:#E8D9B0;
    --ivory:#F3ECDD;
    --ivory-dim:#c9c0ab;
    --pomegranate:#9C3B3B;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html{
    scroll-behavior:smooth;
  }
  html.snap-ready{
    scroll-snap-type:y mandatory;
  }
  @media (prefers-reduced-motion: reduce){
    html.snap-ready{ scroll-snap-type:none; }
  }

  body{
    background:var(--bg-deep);
    color:var(--ivory);
    font-family:'Jost',sans-serif;
    overflow-x:hidden;
    position:relative;
  }

  .snap-page{
    scroll-snap-align:start;
    scroll-snap-stop:always;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  #particle-canvas{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    z-index:0;
    pointer-events:none;
  }

  .content{
    position:relative;
    z-index:1;
  }

  /* ---------- Language switcher ---------- */
  .lang-switch{
    position:fixed;
    top:20px;right:20px;
    z-index:50;
    display:flex;
    gap:2px;
    background:rgba(7,29,24,0.6);
    backdrop-filter:blur(6px);
    border:1px solid rgba(198,161,91,0.35);
    border-radius:999px;
    padding:4px;
  }
  .lang-switch button{
    background:none;
    border:none;
    color:var(--ivory-dim);
    font-family:'Jost',sans-serif;
    font-size:12px;
    letter-spacing:0.08em;
    padding:7px 13px;
    border-radius:999px;
    cursor:pointer;
    transition:all .3s ease;
  }
  .lang-switch button.active{
    background:var(--gold);
    color:var(--bg-deep);
    font-weight:600;
  }

  @media (max-width:640px){
    .lang-switch{ top:14px; right:14px; }
    .lang-switch button{ font-size:11px; padding:6px 10px; }
  }
  @media (max-width:340px){
    .lang-switch button{ padding:5px 8px; }
  }

  /* ---------- Section base ---------- */
  section{
    position:relative;
    padding:120px 24px;
    max-width:920px;
    margin:0 auto;
    text-align:center;
  }

  @media (max-width:640px){
    section{ padding:80px 18px; }
  }
  @media (max-width:380px){
    section{ padding:64px 14px; }
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:28px;
  }

  /* ---------- Hero ---------- */
  #hero{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding-top:80px;
    padding-bottom:60px;
  }
  @media (max-width:640px){
    #hero{ padding-top:64px; padding-bottom:40px; }
  }

  .rosette{
    width:220px;height:220px;
    margin:6px auto 6px;
    animation:spin 90s linear infinite;
  }
  @media (max-width:480px){
    .rosette{ width:160px; height:160px; }
  }
  @media (max-width:340px){
    .rosette{ width:130px; height:130px; }
  }
  @media (prefers-reduced-motion: reduce){
    .rosette{animation:none;}
  }
  .rosette svg{width:100%;height:100%;}

  @keyframes spin{ to{ transform:rotate(360deg); } }

  .name{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-size:clamp(40px,8vw,74px);
    color:var(--ivory);
    line-height:1.05;
    letter-spacing:0.01em;
  }
  .name.italic{ font-style:italic; }

  .amp{
    font-family:'Tangerine',cursive;
    font-size:clamp(60px,12vw,110px);
    color:var(--gold);
    display:block;
    line-height:0.9;
    margin:-6px 0;
  }

  .subtitle{
    margin-top:26px;
    font-size:16px;
    color:var(--ivory-dim);
    letter-spacing:0.03em;
  }

  .date-line{
    margin-top:14px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:22px;
    color:var(--gold-light);
  }

  .scroll-cue{
    margin-top:70px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    font-size:11px;
    letter-spacing:0.2em;
    color:var(--ivory-dim);
    animation:bob 2.4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .scroll-cue{animation:none;} }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(8px);} }
  .scroll-cue svg{ width:16px;height:16px; }

  /* ---------- Divider ---------- */
  .divider{
    width:1px;height:70px;
    background:linear-gradient(var(--gold),transparent);
    margin:0 auto;
  }

  /* ---------- Countdown ---------- */
  h2.section-title{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(20px,6.2vw,42px);
    color:var(--ivory);
    margin-bottom:50px;
    white-space:nowrap;
  }

  .countdown{
    display:flex;
    justify-content:center;
    gap:clamp(10px,3vw,28px);
    flex-wrap:wrap;
  }
  .count-box{
    min-width:78px;
    border:1px solid rgba(198,161,91,0.3);
    background:rgba(198,161,91,0.05);
    border-radius:4px;
    padding:20px 10px 16px;
  }
  .count-num{
    font-family:'Cormorant Garamond',serif;
    font-size:40px;
    color:var(--gold-light);
    font-variant-numeric:tabular-nums;
  }
  .count-label{
    margin-top:6px;
    font-size:10px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ivory-dim);
  }

  /* ---------- Details ---------- */
  .details-grid{
    margin-top:10px;
    display:grid;
    gap:28px;
  }
  .detail-row{
    border-bottom:1px solid rgba(198,161,91,0.18);
    padding-bottom:24px;
  }
  .detail-label{
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:8px;
  }
  .detail-value{
    font-family:'Cormorant Garamond',serif;
    font-size:26px;
    color:var(--ivory);
  }
  .detail-sub{
    margin-top:4px;
    font-size:14px;
    color:var(--ivory-dim);
  }

  .map-embed{
    margin-top:36px;
    width:100%;
    height:320px;
    border:1px solid rgba(198,161,91,0.3);
    border-radius:6px;
    overflow:hidden;
  }
  .map-embed iframe{ display:block; filter:saturate(0.85) brightness(0.92); }

  .map-btn{
    margin-top:20px;
    display:inline-block;
    border:1px solid var(--gold);
    color:var(--gold-light);
    text-decoration:none;
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    padding:14px 34px;
    border-radius:999px;
    transition:all .3s ease;
  }
  .map-btn:hover{ background:var(--gold); color:var(--bg-deep); }

  /* ---------- RSVP ---------- */
  #rsvp{ padding-bottom:100px; }
  .rsvp-form{
    margin-top:40px;
    display:flex;
    flex-direction:column;
    gap:22px;
    text-align:left;
  }
  .field label{
    display:block;
    font-size:11px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:8px;
  }
  .field input[type="text"],
  .field input[type="number"],
  .field textarea{
    width:100%;
    background:rgba(243,236,221,0.04);
    border:1px solid rgba(198,161,91,0.3);
    border-radius:3px;
    color:var(--ivory);
    font-family:'Jost',sans-serif;
    font-size:15px;
    padding:13px 14px;
    outline:none;
    transition:border-color .3s;
  }
  .field input:focus,
  .field textarea:focus{ border-color:var(--gold); }
  .field textarea{ resize:vertical; min-height:90px; }

  .attend-toggle{
    display:flex;
    gap:12px;
  }
  .attend-toggle button{
    flex:1;
    padding:13px;
    background:rgba(243,236,221,0.04);
    border:1px solid rgba(198,161,91,0.3);
    border-radius:3px;
    color:var(--ivory-dim);
    font-family:'Jost',sans-serif;
    font-size:14px;
    letter-spacing:0.04em;
    cursor:pointer;
    transition:all .25s;
  }
  .attend-toggle button.selected{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--bg-deep);
    font-weight:600;
  }

  .submit-btn{
    margin-top:10px;
    background:var(--pomegranate);
    color:var(--ivory);
    border:none;
    padding:16px;
    font-family:'Jost',sans-serif;
    font-size:14px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    border-radius:3px;
    cursor:pointer;
    transition:background .3s;
  }
  .submit-btn:hover{ background:#8a3232; }

  .thank-you{
    display:none;
    text-align:center;
    padding:30px 20px;
    border:1px solid rgba(198,161,91,0.35);
    border-radius:4px;
    margin-top:24px;
  }
  .thank-you.show{ display:block; }
  .thank-you .ty-title{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:26px;
    color:var(--gold-light);
    margin-bottom:10px;
  }
  .thank-you .ty-msg{ color:var(--ivory-dim); font-size:14px; }

  /* ---------- Footer ---------- */
  footer{
    text-align:center;
    padding:70px 24px 60px;
    position:relative;
    z-index:1;
  }
  footer .foot-msg{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:22px;
    color:var(--gold-light);
  }
  footer .foot-names{
    margin-top:10px;
    font-size:12px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--ivory-dim);
  }

  @media (min-width:640px){
    .details-grid{ grid-template-columns:1fr 1fr; }
    .detail-row:last-child{ grid-column:1 / -1; }
  }
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<div class="lang-switch">
  <button data-lang="uz" class="active">UZ</button>
  <button data-lang="ru">RU</button>
  <button data-lang="en">EN</button>
</div>

<div class="content">

  <!-- HERO -->
  <section id="hero" class="snap-page">
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <div class="name">Muxammad</div>
    <span class="amp">&amp;</span>
    <div class="name italic">Zarnigorxon</div>

    <div class="rosette" aria-hidden="true">
      <svg viewBox="0 0 200 200" fill="none">
        <g stroke="#C6A15B" stroke-width="0.6" opacity="0.85">
          <circle cx="100" cy="100" r="92"/>
          <circle cx="100" cy="100" r="78"/>
          <circle cx="100" cy="100" r="30"/>
          <g id="petals"></g>
        </g>
      </svg>
    </div>

    <div class="subtitle" data-i18n="subtitle"></div>
    <div class="date-line" data-i18n="dateLine"></div>

    <div class="scroll-cue">
      <span data-i18n="scrollCue"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4v16m0 0l-6-6m6 6l6-6"/></svg>
    </div>
  </section>

  <div class="divider"></div>

  <!-- COUNTDOWN -->
  <section id="countdown" class="snap-page">
    <h2 class="section-title" data-i18n="countdownTitle"></h2>
    <div class="countdown">
      <div class="count-box"><div class="count-num" id="cd-days">00</div><div class="count-label" data-i18n="days"></div></div>
      <div class="count-box"><div class="count-num" id="cd-hours">00</div><div class="count-label" data-i18n="hours"></div></div>
      <div class="count-box"><div class="count-num" id="cd-mins">00</div><div class="count-label" data-i18n="minutes"></div></div>
      <div class="count-box"><div class="count-num" id="cd-secs">00</div><div class="count-label" data-i18n="seconds"></div></div>
    </div>
  </section>

  <div class="divider"></div>

  <!-- DETAILS -->
  <section id="details" class="snap-page">
    <h2 class="section-title" data-i18n="detailsTitle"></h2>
    <div class="details-grid">
      <div class="detail-row">
        <div class="detail-label" data-i18n="venueLabel"></div>
        <div class="detail-value">Dilshoda to'yxona</div>
        <div class="detail-sub" data-i18n="addressValue"></div>
      </div>
      <div class="detail-row">
        <div class="detail-label" data-i18n="dateLabel"></div>
        <div class="detail-value" data-i18n="dateValue"></div>
        <div class="detail-sub" data-i18n="timeValue"></div>
      </div>
    </div>
    <div class="map-embed">
      <iframe
        src="https://yandex.uz/map-widget/v1/?ll=65.970182%2C40.029042&z=17&pt=65.970182%2C40.029042,pm2rdm"
        width="100%" height="100%" frameborder="0" loading="lazy"
        allowfullscreen title="Dilshoda to'yxona - xarita"></iframe>
    </div>
    <a class="map-btn" id="map-link" href="https://yandex.uz/maps/org/dilshoda/228351531215/?tab=gallery&ll=65.970182%2C40.029042&z=19" target="_blank" rel="noopener" data-i18n="mapBtn"></a>
  </section>

  <div class="divider"></div>

  <!-- RSVP -->
  <section id="rsvp" class="snap-page">
    <h2 class="section-title" data-i18n="rsvpTitle"></h2>
    <p class="subtitle" data-i18n="rsvpSubtitle" style="margin-bottom:10px;"></p>

    <form class="rsvp-form" id="rsvp-form">
      <div class="field">
        <label data-i18n="nameLabel"></label>
        <input type="text" id="rsvp-name" required>
      </div>

      <div class="field">
        <label data-i18n="attendingLabel"></label>
        <div class="attend-toggle">
          <button type="button" class="attend-btn selected" data-value="yes" data-i18n="attendingYes"></button>
          <button type="button" class="attend-btn" data-value="no" data-i18n="attendingNo"></button>
        </div>
      </div>

      <div class="field">
        <label data-i18n="guestsLabel"></label>
        <input type="number" id="rsvp-guests" min="1" max="10" value="1">
      </div>

      <div class="field">
        <label data-i18n="messageLabel"></label>
        <textarea id="rsvp-message"></textarea>
      </div>

      <button type="submit" class="submit-btn" data-i18n="submitBtn"></button>
    </form>

    <div class="thank-you" id="thank-you">
      <div class="ty-title" data-i18n="thankYouTitle"></div>
      <div class="ty-msg" data-i18n="thankYouMsg"></div>
    </div>
  </section>

  <footer class="snap-page">
    <div class="foot-msg" data-i18n="footerText"></div>
    <div class="foot-names">Muxammad &amp; Zarnigorxon — 11.09.2026</div>
  </footer>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ======================= TRANSLATIONS ======================= */
const translations = {
  uz: {
    eyebrow: "To'y taklifnomasi",
    subtitle: "Sizni nikoh to'yimizga taklif qilamiz",
    dateLine: "11-sentyabr, 2026 · soat 19:00",
    scrollCue: "Pastga suring",
    countdownTitle: "To'yimizgacha qoldi",
    days: "kun", hours: "soat", minutes: "daqiqa", seconds: "soniya",
    detailsTitle: "Tadbir tafsilotlari",
    venueLabel: "To'yxona",
    addressValue: "Manzilni pastdagi xaritadan ko'ring",
    dateLabel: "Sana va vaqt",
    dateValue: "11-sentyabr, 2026-yil",
    timeValue: "Boshlanishi: soat 19:00",
    mapBtn: "Xaritada ko'rish",
    rsvpTitle: "Ishtirokingizni tasdiqlang",
    rsvpSubtitle: "Bayramimizni siz bilan birga nishonlashni orzu qilamiz",
    nameLabel: "Ismingiz",
    attendingLabel: "Kelasizmi?",
    attendingYes: "Ha, albatta",
    attendingNo: "Afsuski, yo'q",
    guestsLabel: "Mehmonlar soni",
    messageLabel: "Xabar (ixtiyoriy)",
    submitBtn: "Yuborish",
    thankYouTitle: "Rahmat!",
    thankYouMsg: "Javobingiz qabul qilindi. To'yimizda ko'rishguncha!",
    footerText: "Sizni sabrsizlik bilan kutamiz",
  },
  ru: {
    eyebrow: "Свадебное приглашение",
    subtitle: "Приглашаем вас на нашу свадьбу",
    dateLine: "11 сентября 2026 · 19:00",
    scrollCue: "Прокрутите вниз",
    countdownTitle: "До свадьбы осталось",
    days: "дней", hours: "часов", minutes: "минут", seconds: "секунд",
    detailsTitle: "Детали торжества",
    venueLabel: "Место проведения",
    addressValue: "Адрес смотрите на карте ниже",
    dateLabel: "Дата и время",
    dateValue: "11 сентября 2026 года",
    timeValue: "Начало: 19:00",
    mapBtn: "Открыть карту",
    rsvpTitle: "Подтвердите участие",
    rsvpSubtitle: "Будем рады отпраздновать этот день вместе с вами",
    nameLabel: "Ваше имя",
    attendingLabel: "Вы придёте?",
    attendingYes: "Да, конечно",
    attendingNo: "К сожалению, нет",
    guestsLabel: "Количество гостей",
    messageLabel: "Сообщение (необязательно)",
    submitBtn: "Отправить",
    thankYouTitle: "Спасибо!",
    thankYouMsg: "Ваш ответ получен. До встречи на свадьбе!",
    footerText: "С нетерпением ждём встречи с вами",
  },
  en: {
    eyebrow: "Wedding Invitation",
    subtitle: "You are warmly invited to our wedding",
    dateLine: "September 11, 2026 · 7:00 PM",
    scrollCue: "Scroll down",
    countdownTitle: "Counting down to our day",
    days: "days", hours: "hours", minutes: "minutes", seconds: "seconds",
    detailsTitle: "Event Details",
    venueLabel: "Venue",
    addressValue: "See location on the map below",
    dateLabel: "Date & Time",
    dateValue: "September 11, 2026",
    timeValue: "Starts at 7:00 PM",
    mapBtn: "View on map",
    rsvpTitle: "Confirm your attendance",
    rsvpSubtitle: "We would love to celebrate this day with you",
    nameLabel: "Your name",
    attendingLabel: "Will you attend?",
    attendingYes: "Yes, gladly",
    attendingNo: "Sadly, no",
    guestsLabel: "Number of guests",
    messageLabel: "Message (optional)",
    submitBtn: "Submit",
    thankYouTitle: "Thank you!",
    thankYouMsg: "Your response has been recorded. See you at the wedding!",
    footerText: "We can't wait to celebrate with you",
  }
};

let currentLang = "uz";

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(translations[lang][key] !== undefined){
      el.textContent = translations[lang][key];
    }
  });
  document.querySelectorAll(".lang-switch button").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });
}

document.querySelectorAll(".lang-switch button").forEach(btn=>{
  btn.addEventListener("click", ()=> applyLang(btn.dataset.lang));
});

applyLang("uz");

/* ======================= SCROLL SNAP (enabled once layout has settled) ======================= */
function enableScrollSnap(){
  document.documentElement.classList.add("snap-ready");
}
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(enableScrollSnap).catch(enableScrollSnap);
} else {
  enableScrollSnap();
}
window.addEventListener("load", enableScrollSnap);
setTimeout(enableScrollSnap, 2500);

/* ======================= ROSETTE PETALS (SVG) ======================= */
const petalGroup = document.getElementById("petals");
const petalCount = 16;
for(let i=0;i<petalCount;i++){
  const angle = (360/petalCount)*i;
  const line = document.createElementNS("http://www.w3.org/2000/svg","line");
  line.setAttribute("x1","100"); line.setAttribute("y1","30");
  line.setAttribute("x2","100"); line.setAttribute("y2","55");
  line.setAttribute("transform",`rotate(${angle} 100 100)`);
  petalGroup.appendChild(line);
}

/* ======================= COUNTDOWN ======================= */
const targetDate = new Date("2026-09-11T19:00:00+05:00").getTime();

function updateCountdown(){
  const now = Date.now();
  let diff = targetDate - now;
  if(diff < 0) diff = 0;

  const days = Math.floor(diff / (1000*60*60*24));
  const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
  const mins = Math.floor((diff % (1000*60*60)) / (1000*60));
  const secs = Math.floor((diff % (1000*60)) / 1000);

  document.getElementById("cd-days").textContent = String(days).padStart(2,"0");
  document.getElementById("cd-hours").textContent = String(hours).padStart(2,"0");
  document.getElementById("cd-mins").textContent = String(mins).padStart(2,"0");
  document.getElementById("cd-secs").textContent = String(secs).padStart(2,"0");
}
updateCountdown();
setInterval(updateCountdown, 1000);

/* ======================= RSVP FORM ======================= */
let attendingValue = "yes";

/* ======================= THREE.JS PARTICLE FIELD ======================= */
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = document.getElementById("particle-canvas");

if(!reduceMotion && window.THREE){
  const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.z = 14;

  const PARTICLE_COUNT = 220;
  const positions = new Float32Array(PARTICLE_COUNT * 3);
  const speeds = new Float32Array(PARTICLE_COUNT);
  const drift = new Float32Array(PARTICLE_COUNT);

  for(let i=0;i<PARTICLE_COUNT;i++){
    positions[i*3] = (Math.random()-0.5) * 26;
    positions[i*3+1] = (Math.random()-0.5) * 20;
    positions[i*3+2] = (Math.random()-0.5) * 14;
    speeds[i] = 0.004 + Math.random()*0.008;
    drift[i] = Math.random()*Math.PI*2;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

  // soft circular sprite drawn on a canvas texture
  const spriteCanvas = document.createElement("canvas");
  spriteCanvas.width = 64; spriteCanvas.height = 64;
  const ctx = spriteCanvas.getContext("2d");
  const grad = ctx.createRadialGradient(32,32,0,32,32,32);
  grad.addColorStop(0, "rgba(232,217,176,0.9)");
  grad.addColorStop(0.4, "rgba(198,161,91,0.5)");
  grad.addColorStop(1, "rgba(198,161,91,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,64,64);
  const spriteTexture = new THREE.CanvasTexture(spriteCanvas);

  const material = new THREE.PointsMaterial({
    size: 0.42,
    map: spriteTexture,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    opacity: 0.85
  });

  const points = new THREE.Points(geometry, material);
  scene.add(points);

  let mouseX = 0, mouseY = 0;
  window.addEventListener("mousemove", (e)=>{
    mouseX = (e.clientX / window.innerWidth - 0.5);
    mouseY = (e.clientY / window.innerHeight - 0.5);
  });

  function animate(){
    requestAnimationFrame(animate);
    const pos = geometry.attributes.position.array;
    for(let i=0;i<PARTICLE_COUNT;i++){
      pos[i*3+1] += speeds[i];
      pos[i*3] += Math.sin(Date.now()*0.0006 + drift[i]) * 0.0025;
      if(pos[i*3+1] > 11){
        pos[i*3+1] = -11;
      }
    }
    geometry.attributes.position.needsUpdate = true;

    camera.position.x += (mouseX*1.2 - camera.position.x) * 0.02;
    camera.position.y += (-mouseY*1.2 - camera.position.y) * 0.02;
    camera.lookAt(scene.position);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener("resize", ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
} else {
  canvas.style.display = "none";
}
</script>
</body>
</html>
